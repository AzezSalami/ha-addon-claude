name: Claude API
version: "0.9.0"
slug: claude_api
description: Local HTTP API in front of the Claude Code CLI, using your own Claude Pro login.
url: https://github.com/AzezSalami/ha-addon-claude
arch:
  - amd64
  - aarch64
init: false
startup: application
map:
  - addon_config:rw
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "HTTP API (POST /v1/ask). Keep it on your LAN."
options:
  api_token: ""
  oauth_token: ""
  default_model: ""
  timeout_seconds: 120
  max_concurrent: 1
  fetch_youtube_captions: true
  caption_languages: "en.*"
  fetch_instagram_captions: true
  clean_json_replies: true
  log_requests: "off"
  voice_instructions: ""
  voice_memory_minutes: 10
schema:
  api_token: password
  oauth_token: password?
  default_model: str?
  timeout_seconds: int(10,600)
  max_concurrent: int(1,4)
  fetch_youtube_captions: bool
  caption_languages: str
  fetch_instagram_captions: bool
  clean_json_replies: bool
  log_requests: list(off|summary|full)
  voice_instructions: str?
  voice_memory_minutes: int(0,1440)
